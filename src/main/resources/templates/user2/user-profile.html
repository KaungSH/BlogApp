<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/public_layout}">
<head>
<meta charset="UTF-8">
<title>Edit Profile</title>
<style>
        .error {
            color: red;
            font-size: 0.950rem;
        }

        #coverPreview {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 10px;
        }
</style>
</head>
<div layout:fragment = "content">
<div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card shadow-sm">
                
                    <div class="card-header bg-secondary text-white">
                        <h2 class="mb-0">Edit Profile</h2>
                    </div>

                    <div class="card-body p-4">

                        <form method="post" th:action="@{/pedit}" th:object="${user}" enctype="multipart/form-data">
                        <div class = "error" th:text = "${error}"></div>
                        <input type="hidden" th:field="${user.id}" /> 

                            <!-- UserName -->
                            <div class="mb-4">
                                <label for="username" class="form-label fw-semibold">
                                    Change UserName
                                </label>
                                <input type="text" id="username" class="form-control" th:field="*{username}" placeholder="Enter username" required>
                            </div>
                            
                            <!-- Phone -->
                            <div class="mb-4">
                                <label for="phone" class="form-label fw-semibold">
                                    Change Phone Number
                                </label>
                                <input type="text" id="phone" class="form-control" th:field="*{phone}" placeholder="Enter Phone Number" required>
                            </div>
                            
                            <!-- Password -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">
                                    Enter Password
                                </label>
                                <input type="password" id="password" class="form-control" th:field="*{password}" placeholder="Enter Password" required>
                            </div>
                            
                            <!-- Original Profile Pic -->
                            <label>Original Profile Picture</label>
                            <div style="text-align: center;">
						    	<div style="align-items: center; width: 100%;">
							        <img th:if="${session.loggedInUser.photo != null}" 
						             th:src="@{/photos/{id}(id=${session.loggedInUser.id})}" 
						             alt="Thumbnail Error" 
						             style="height: 200px; width: auto; object-fit: cover; border-radius: 8px;" >
							             
							        <div th:unless="${session.loggedInUser.photo != null}">No Image</div>
							    </div>
							</div>

                            <!-- Cover Image -->
                            <div class="mb-4">

                                <label for="coverImg" class="form-label fw-semibold">
                                   Change Cover Image
                                </label>
                                
                                <input type="file" id="coverImg" name="coverImgPart" class="form-control" accept="image/*">
                                <div class="form-text">
                                    Select an image to use as the cover of your user.
                                </div>

                                <div class="mt-3">
                                    <img id="coverPreview" class="img-fluid" style="display: none;" alt="Cover image Error">
                                </div>

                            </div>

                            <!-- Buttons -->
                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">

                                <a th:href="@{/}" class="btn btn-outline-secondary">
                                    Cancel
                                </a>
                                <button type="submit"
                                        class="btn btn-secondary">
                                    Edit Profile
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
	<!-- Bootstrap JavaScript -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>


    <!-- Image Preview -->
    <script>
        document.getElementById("coverImg").addEventListener("change", function(event) {

            const file = event.target.files[0];
            const preview = document.getElementById("coverPreview");

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            } else {
                preview.src = "";
                preview.style.display = "none";
            }
        });
    </script>
</div>
</html>
