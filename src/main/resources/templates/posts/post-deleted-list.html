<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate = "~{layouts/admin_layout}">
<head>
<meta charset="UTF-8">
<title>Post List - Deleted</title>
</head>
<div layout:fragment = "content">
	<h2>Post List</h2>
	<a th:href = "@{/posts}">Go Back To Post List</a>
	<table class = "table table-bordered table-striped">
		<thead>
			<tr>
				<th>No.</th>
				
				<th>Thumbnail</th>
				
				<th>Title</th>
				
				<th>Category</th>
				
				<th>Tags</th>
				
				<th>Status</th>
				
				<th>Created At</th>

				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="p,state:${posts}" style = "height : 200px">
				<td th:text = "${state.count}"></td>
				
				<td style="text-align: center;">
				    <div style="align-items: center; width: 100%;">
				        <img th:if="${p.coverImgName != null}" 
				             th:src="@{'/images/' + ${p.coverImgName}}" 
				             alt="Thumbnail Error" 
				             style="height: 198px; width: auto; object-fit: cover; border-radius: 8px;" />
				             
				        <div th:unless="${p.coverImgName != null}">No Image</div>
				    </div>
				</td>
				
				<td th:text = "${p.title}"></td>
				
				<td th:text = "${p.categoryName}"></td>
				
				<td th:text = "${p.tagNames != null and p.tagNames != 'null' ? p.tagNames : '!!No Tags!!'}"></td>
				
				<td th:text = "${p.status}"></td>
				
				<td th:text = "${p.createdAt}"></td>
				
				<td>
					<a th:href = "@{/posts/recover/{id}(id = ${p.id})}" onclick="return confirm('Recover Post?');">Recover Post</a>
				</td>
			</tr>
		</tbody>
	</table>
</div>
</html>
