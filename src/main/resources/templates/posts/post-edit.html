<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/admin_layout}">
<head>
<meta charset="UTF-8">
<title>Edit Post - BlogApp</title>
</head>
<style>
.error {
	color: red;
}
</style>
<div layout:fragment="content">
	<div class="bg-light">
		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-lg-8 col-xl-7">
					<div class="card shadow-sm">

						<div class="card-header bg-secondary text-white">
							<h2 class="mb-0">Edit Post</h2>
						</div>

						<div class="card-body p-4">
							<form method="post" th:action="@{/posts/edit}"
								th:object="${post}" enctype="multipart/form-data">
								<input type="hidden" th:field="${post.id}" /> <input
									type="hidden" th:field="${post.cover_img_path}" />

								<div class="mb-4">
									<label for="title" class="form-label fw-semibold">
										Title </label> <input type="text" id="title" class="form-control"
										th:field="*{title}" placeholder="Enter post title" required>
								</div>

								<div class="mb-4">
									<label for="content" class="form-label fw-semibold">
										Content </label>
									<textarea id="content" class="form-control"
										th:field="*{content}" rows="8"
										placeholder="Write your post here..." required></textarea>
								</div>

								<div class="mb-4">
									<label class="form-label fw-semibold"> Original Cover
										Image </label><br> <img th:if="${post.coverImgName != null}"
										th:src="@{'/images/' + ${post.coverImgName}}"
										alt="Thumbnail Error"
										style="height: 300px; width: auto; object-fit: cover;" />
									<div th:unless="${post.coverImgName != null}">No Image</div>
								</div>

								<div class="mb-4">

									<label for="coverImg" class="form-label fw-semibold">
										New Cover Image </label> <input type="file" id="coverImg"
										name="coverImgPart" class="form-control" accept="image/*">
									<div class="form-text">Select an image to use as the
										cover of your post.</div>

									<div class="mt-3">
										<img id="coverPreview" class="img-fluid"
											style="height: 300px; width: auto;" alt="Cover image Error">
									</div>

								</div>

								<div class="mb-4">

									<label class="form-label fw-semibold d-block"> Status </label>

									<div class="d-flex gap-4">

										<div class="form-check" th:each="s : ${availableStatus}">

											<input class="form-check-input bg-secondary" type="radio"
												th:field="*{status}" th:value="${s}"
												th:id="${'status-' + s}"> <label
												class="form-check-label" th:for="${'status-' + s}"
												th:text="${s}"></label>
										</div>
									</div>
								</div>

								<div class="mb-4">

									<label for="category" class="form-label fw-semibold">
										Category </label> <select id="category" class="form-select"
										th:field="*{category_id}">
										<option value="0" disabled>--- Select One ---</option>
										<option th:if="${c.id > 0}"
											th:each="c : ${availableCategories}" th:value="${c.id}"
											th:text="${c.name}"></option>
									</select>

									<div th:if="${#fields.hasErrors('category_id')}"
										th:errors="*{category_id}" class="error mt-1"></div>
								</div>

								<div class="mb-4">

									<label class="form-label fw-semibold d-block"> Tags </label>

									<div class="d-flex flex-wrap gap-3">

										<div class="form-check" th:each="t : ${availableTags}">

											<input class="form-check-input bg-secondary" type="checkbox"
												th:field="*{tagIds}" th:value="${t.id}"
												th:id="${'tag-' + t.id}"> <label
												class="form-check-label" th:for="${'tag-' + t.id}"
												th:text="${t.name}"></label>
										</div>
									</div>
								</div>

								<div
									class="d-flex justify-content-between align-items-center pt-3 border-top">

									<a th:href="@{/posts}" class="btn btn-outline-secondary">
										Cancel </a>
									<button type="submit" class="btn btn-secondary">
										Edit Post</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- Bootstrap JavaScript -->
		<script th:src="@{/js/bootstrap.bundle.min.js}"></script>


		<!-- Image Preview -->
		<script>
			document.getElementById("coverImg")
					.addEventListener(
							"change",
							function(event) {

								const file = event.target.files[0];
								const preview = document
										.getElementById("coverPreview");

								if (file) {
									preview.src = URL.createObjectURL(file);
									preview.style.display = "block";
								} else {
									preview.src = "";
									preview.style.display = "none";
								}
							});
		</script>
	</div>
</div>
</html>
