<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate = "~{layouts/admin_layout}">
<head>
<meta charset="UTF-8">
<title>Add Category - BlogApp</title>
</head>
<div layout:fragment = "content">
	<h2>Add Category Form</h2>
	<form method = "post" th:action = "@{/categories/add}" th:object = "${category}">
	
		<div>
			<label> Name : </label>
			<input type = "text" th:field = "${category.name}" required>
		</div>
		
		<div>
			<label> Description : </label>
			<input type = "text" th:field = "${category.description}">
		</div>
		
		<input type = "submit" value = "Add Category">
	</form>
	<form method = "get" th:action = "@{/categories}" th:object = "${category}">
			<input type = "submit" value = "Cancel"/>
	</form>
</div>
</html>
