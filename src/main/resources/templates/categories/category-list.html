<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate = "~{layouts/admin_layout}">
<head>
<meta charset="UTF-8">
<title>Categories</title>
</head>
<div layout:fragment = "content">
	<h2>Categories List</h2>
	<a th:href = "@{categories/add}">Add Category</a>
	<table class = "table table-bordered table-striped">
		<thead>
			<tr>
				<th>No.</th>
				<th>Name</th>
				<th>Description</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="t,state:${categories}" th:if="${t.id > 0}">
				<td th:text = "${state.index}"></td>
				<td th:text = "${t.name}"></td>
				<td th:text = "${t.description}"></td>
				<td>
					<a th:href = "@{/categories/edit/{id}(id = ${t.id})}">Edit Category</a>
					<a th:href = "@{/categories/delete/{id}(id = ${t.id})}">Delete Category</a>
				</td>
			</tr>
		</tbody>
	</table>
</div>
</html>
