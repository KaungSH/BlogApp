<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="header">
	 <nav class="navbar navbar-expand-lg bg-secondary navbar-info">

        <div class="container">
			
            <a class="navbar-brand"
               th:href="@{/}">
               <img th:src="@{/favicon.ico}" alt="Favicon" style="width: 32px; height: 32px;" class = "shadow-lg" />
                Blog App Spring Boot Version 2.0
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarContent">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item" th:if = "${session.loggedInUser == null}">
                        <a class="nav-link"
                           th:href="@{/signup}">
                            SignUp
                        </a>
                    </li>
                    
                    <li class="nav-item" th:if = "${session.loggedInUser != null}">
                   	<a class="nav-link"
                           th:href="@{/signup}">
                            AddAcc
                    </a>
                    </li>
                    
                     <li class="nav-item" th:if = "${session.loggedInUser == null}">
                        <a class="nav-link"
                           th:href="@{/login}">
                            Log In
                        </a>
                    </li>
                    
                     <li class="nav-item" th:if = "${session.loggedInUser != null}">
                        <a class="nav-link"
                           th:href="@{/logout}" onclick="return confirm('Are you sure you want to log out?');">
                           Log Out
                        </a>
                    </li>

					<li class="nav-item" th:if = "${session.loggedInUser != null}">
                        <a class="nav-link"
                           th:href="@{/pedit}">
                           <strong th:text="${session.loggedInUser.username}"></strong>
                           
                            
						        <img th:if="${session.loggedInUser.photo != null}" 
						             th:src="@{/photos/{id}(id=${session.loggedInUser.id})}" 
						             alt="Thumbnail Error" 
						             style="height: 30px; width: 30px; object-fit: cover; border-radius: 100%;" class = "shadow-lg">
				    		
                        </a>
                        
                    </li>

                </ul>

            </div>

        </div>

    </nav>
</div>
