<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate = "~{layouts/admin_layout}">
<head>
<meta charset="UTF-8">
<title>Tags</title>
</head>
<div layout:fragment = "content">
	<h2>Tags List</h2>
	<a th:href = "@{tags/add}">Add Tags</a>
	<table class = "table table-bordered table-striped">
		<thead>
			<tr>
				<th>No.</th>
				<th>Name</th>
				<th>Description</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="t,state:${tags}">
				<td th:text = "${state.count}"></td>
				<td th:text = "${t.name}"></td>
				<td th:text = "${t.description}"></td>
				<td>
					<a th:href = "@{/tags/edit/{id}(id = ${t.id})}">Edit Tag</a>
					<a th:href = "@{/tags/delete/{id}(id = ${t.id})}">Delete Tag</a>
				</td>
			</tr>
		</tbody>
	</table>
</div>
</html>
