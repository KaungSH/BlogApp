<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate = "~{layouts/admin_layout}">
<head>
<meta charset="UTF-8">
<title>Edit Tag - BlogApp</title>
</head>
<div layout:fragment = "content">
	<h2>Edit Tag Form</h2>
	<form method = "post" th:action = "@{/tags/edit}" th:object = "${tag}">
		<input type = "hidden" th:field = "${tag.id}"/>
		<div>
			<label> Name : </label>
			<input type = "text" th:field = "${tag.name}">
		</div>
		
		<div>
			<label> Description : </label>
			<input type = "text" th:field = "${tag.description}">
		</div>
		
		<input type = "submit" value = "Edit Tag">
	</form>
	<form method = "get" th:action = "@{/tags}" th:object = "${tag}">
			<input type = "submit" value = "Cancel"/>
	</form>
</div>
</html>
